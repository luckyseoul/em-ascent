[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "em-ascent"
version = "0.1.0"
description = "Magnetic pad retrofit that leaves Super Heavy propellant in the tanks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nicholas Dean Perry" }]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
