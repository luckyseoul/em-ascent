[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "em-ascent"
version = "0.1.0"
description = "Electromagnetic launch tube for small rockets: spread the start so the motor can take over already climbing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nicholas Dean Perry" }]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
em-ascent = "em_ascent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
