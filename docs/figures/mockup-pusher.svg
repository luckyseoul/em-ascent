<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#14181d"/>
  <text x="48" y="58" fill="#f4f1ea" font-family="Georgia, serif" font-size="32">Pusher ring</text>
  <text x="48" y="92" fill="#9aa3ad" font-family="sans-serif" font-size="16">Bolted to the mount that is already there. Engines stay lit.</text>

  <rect x="80" y="760" width="760" height="28" fill="#3a414a"/>
  <text x="460" y="780" text-anchor="middle" fill="#c8c2b4" font-family="sans-serif" font-size="13">Water-cooled steel plate</text>
  <rect x="80" y="788" width="760" height="18" fill="#2a241c"/>

  <polygon points="430,760 530,760 555,690 405,690" fill="#6a4a32" opacity="0.85"/>
  <text x="620" y="730" fill="#e7c4a0" font-family="sans-serif" font-size="14">Plume stays on the plate</text>

  <g>
    <polygon points="392,690 412,690 406,640 398,640" fill="#8d97a3"/>
    <polygon points="432,690 452,690 446,640 438,640" fill="#8d97a3"/>
    <polygon points="508,690 528,690 522,640 514,640" fill="#8d97a3"/>
    <polygon points="548,690 568,690 562,640 558,640" fill="#8d97a3"/>
  </g>
  <text x="640" y="670" fill="#d5dbe3" font-family="sans-serif" font-size="14">33 Raptors, 80.8 MN</text>

  <rect x="400" y="180" width="160" height="470" rx="8" fill="#c5ced8" stroke="#1f4e79" stroke-width="3"/>
  <text x="480" y="250" text-anchor="middle" fill="#1f4e79" font-family="sans-serif" font-size="18">Super Heavy</text>
  <text x="480" y="276" text-anchor="middle" fill="#3a414a" font-family="sans-serif" font-size="14">9 m diameter</text>
  <text x="480" y="302" text-anchor="middle" fill="#3a414a" font-family="sans-serif" font-size="14">5,300 t at liftoff</text>

  <rect x="330" y="560" width="70" height="70" fill="#c4a35a" stroke="#1c1c1c" stroke-width="2"/>
  <rect x="560" y="560" width="70" height="70" fill="#c4a35a" stroke="#1c1c1c" stroke-width="2"/>
  <text x="250" y="500" text-anchor="end" fill="#8fd0ad" font-family="sans-serif" font-size="16">5 MN total</text>
  <line x1="258" y1="494" x2="328" y2="530" stroke="#2f6f4e" stroke-width="2"/>
  <line x1="365" y1="555" x2="365" y2="470" stroke="#2f6f4e" stroke-width="4"/>
  <polygon points="365,462 353,484 377,484" fill="#2f6f4e"/>
  <line x1="595" y1="555" x2="595" y2="470" stroke="#2f6f4e" stroke-width="4"/>
  <polygon points="595,462 583,484 607,484" fill="#2f6f4e"/>

  <line x1="700" y1="180" x2="700" y2="620" stroke="#b85c38" stroke-width="2"/>
  <line x1="688" y1="180" x2="712" y2="180" stroke="#b85c38" stroke-width="2"/>
  <line x1="688" y1="620" x2="712" y2="620" stroke="#b85c38" stroke-width="2"/>
  <text x="720" y="400" fill="#e7c4a0" font-family="sans-serif" font-size="16">40 m stroke</text>
  <text x="720" y="424" fill="#9aa3ad" font-family="sans-serif" font-size="14">shoes run off</text>

  <g font-family="sans-serif">
    <rect x="900" y="180" width="440" height="420" rx="10" fill="#1c2228" stroke="#3a414a"/>
    <text x="928" y="230" fill="#f4f1ea" font-size="20">What the integration found</text>
    <text x="928" y="280" fill="#9aa3ad" font-size="15">Shoes release</text>
    <text x="928" y="308" fill="#f4f1ea" font-size="22">3.6 s, stack at 24 m/s</text>
    <text x="928" y="352" fill="#9aa3ad" font-size="15">Most of that speed is the Raptors</text>
    <text x="928" y="400" fill="#9aa3ad" font-size="15">Same burnout speed if you leave</text>
    <text x="928" y="434" fill="#c4a35a" font-size="28">14.9 t in the tanks</text>
    <text x="928" y="470" fill="#d5dbe3" font-size="16">11.7 t oxygen, 3.2 t methane</text>
    <text x="928" y="520" fill="#9aa3ad" font-size="15">Peak electrical power</text>
    <text x="928" y="550" fill="#f4f1ea" font-size="22">43 MW, under a second</text>
  </g>
</svg>
