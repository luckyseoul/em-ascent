<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#14181d"/>
  <text x="48" y="58" fill="#f4f1ea" font-family="Georgia, serif" font-size="32">Powered hold-down</text>
  <text x="48" y="92" fill="#9aa3ad" font-family="sans-serif" font-size="16">The clamps already carry the stack. Give them a short powered stroke.</text>

  <rect x="160" y="700" width="700" height="36" fill="#3a414a"/>
  <rect x="160" y="736" width="700" height="22" fill="#2a241c"/>
  <text x="510" y="724" text-anchor="middle" fill="#c8c2b4" font-family="sans-serif" font-size="14">Deluge plate</text>

  <rect x="300" y="560" width="420" height="140" rx="6" fill="#5c6670" stroke="#c4a35a" stroke-width="3"/>
  <text x="510" y="640" text-anchor="middle" fill="#f4f1ea" font-family="sans-serif" font-size="20">Hold-down clamps</text>
  <text x="510" y="670" text-anchor="middle" fill="#e7c4a0" font-family="sans-serif" font-size="15">about 10 m of travel at 5 MN</text>

  <rect x="390" y="180" width="240" height="370" rx="8" fill="#c5ced8" stroke="#1f4e79" stroke-width="3"/>
  <text x="510" y="340" text-anchor="middle" fill="#1f4e79" font-family="sans-serif" font-size="22">Stack</text>
  <text x="510" y="372" text-anchor="middle" fill="#3a414a" font-family="sans-serif" font-size="16">5,300 t</text>

  <line x1="510" y1="545" x2="510" y2="470" stroke="#2f6f4e" stroke-width="4"/>
  <polygon points="510,462 498,484 522,484" fill="#2f6f4e"/>
  <text x="160" y="300" fill="#8fd0ad" font-family="sans-serif" font-size="18">Release is a shove</text>
  <text x="160" y="326" fill="#9aa3ad" font-family="sans-serif" font-size="15">not a drop onto the plate</text>

  <g font-family="sans-serif">
    <rect x="900" y="200" width="440" height="360" rx="10" fill="#1c2228" stroke="#3a414a"/>
    <text x="928" y="250" fill="#f4f1ea" font-size="20">Smallest change</text>
    <text x="928" y="310" fill="#c4a35a" font-size="28">7.6 t left in the tanks</text>
    <text x="928" y="350" fill="#d5dbe3" font-size="16">5 MN through 10 m of clamp travel</text>
    <text x="928" y="410" fill="#9aa3ad" font-size="16">The plume leaves the steel plate sooner.</text>
    <text x="928" y="438" fill="#9aa3ad" font-size="16">That plate is the part the pad keeps rebuilding.</text>
    <text x="928" y="500" fill="#f4f1ea" font-size="16">No new tower. No new trench.</text>
  </g>
</svg>
