<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#14181d"/>
  <text x="48" y="58" fill="#f4f1ea" font-family="Georgia, serif" font-size="32">Tower-column rail</text>
  <text x="48" y="92" fill="#9aa3ad" font-family="sans-serif" font-size="16">Only if the mount foundation cannot take the ring.</text>

  <rect x="160" y="120" width="90" height="640" fill="#4a5560"/>
  <rect x="250" y="200" width="18" height="480" fill="#c4a35a"/>
  <text x="205" y="790" text-anchor="middle" fill="#c8c2b4" font-family="sans-serif" font-size="14">Tower column</text>
  <text x="205" y="812" text-anchor="middle" fill="#9aa3ad" font-family="sans-serif" font-size="13">about 146 m, already built</text>

  <rect x="340" y="160" width="200" height="560" rx="8" fill="#c5ced8" stroke="#1f4e79" stroke-width="3"/>
  <text x="440" y="400" text-anchor="middle" fill="#1f4e79" font-family="sans-serif" font-size="18">Booster</text>

  <circle cx="330" cy="230" r="14" fill="#b85c38" stroke="#1c1c1c" stroke-width="2"/>
  <text x="580" y="220" fill="#e7c4a0" font-family="sans-serif" font-size="16">Catch pins</text>
  <text x="580" y="244" fill="#9aa3ad" font-family="sans-serif" font-size="14">Stay for landing.</text>
  <text x="580" y="266" fill="#9aa3ad" font-family="sans-serif" font-size="14">Little tower left above them.</text>
  <line x1="346" y1="230" x2="568" y2="226" stroke="#b85c38" stroke-width="1.5"/>

  <circle cx="330" cy="520" r="16" fill="#2f6f4e" stroke="#1c1c1c" stroke-width="2"/>
  <line x1="310" y1="520" x2="310" y2="360" stroke="#8fd0ad" stroke-width="3"/>
  <polygon points="310,352 298,372 322,372" fill="#8fd0ad"/>
  <text x="580" y="500" fill="#8fd0ad" font-family="sans-serif" font-size="16">New pins, lower down</text>
  <text x="580" y="526" fill="#d5dbe3" font-family="sans-serif" font-size="14">Rail lagged to the column.</text>
  <text x="580" y="550" fill="#d5dbe3" font-family="sans-serif" font-size="14">A few meganewtons, same class as the ring.</text>

  <g font-family="sans-serif">
    <rect x="900" y="620" width="440" height="150" rx="10" fill="#1c2228" stroke="#3a414a"/>
    <text x="928" y="670" fill="#f4f1ea" font-size="18">Chopsticks are not the pusher</text>
    <text x="928" y="708" fill="#9aa3ad" font-size="15">They catch a nearly empty booster.</text>
    <text x="928" y="734" fill="#9aa3ad" font-size="15">They are not rated for 5,300 t.</text>
  </g>
</svg>
